[package]
name = "themezzz"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Telegram theme-creator bot: turn any picture into a .attheme"

[[bin]]
name = "themezzz"
path = "src/main.rs"

[dependencies]
teloxide = { version = "0.13", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
image = "0.25"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
itertools = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
